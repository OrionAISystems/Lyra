name: Lyra verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lyra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Rust and shared build cache
        uses: ./.github/actions/setup-rust

      - name: Verify release metadata
        run: |
          npm run verify:version
          npm run verify:changelog
          npm run verify:release-config
          npm run verify:themes

      - name: Build and test frontend
        run: |
          npm run build
          npm test -- --run

      - name: Format and test Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml --features regression-bench

      - name: Verify signed seasonal theme fixture through Rust
        run: npm run test:themes-fixture
        env:
          LYRA_FIXTURE_FEATURES: regression-bench

      - name: Warm the release Tauri build cache
        if: github.event_name == 'push'
        run: npm run tauri build -- --no-bundle
