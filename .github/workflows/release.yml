name: Lyra Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: lyra-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish NSIS release
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Cargo registry, Git dependencies, and release artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/release
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-release-

      - name: Validate updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY must be configured before signing release artifacts."
          }
          $probe = Join-Path $env:RUNNER_TEMP "lyra-updater-signing-probe.txt"
          Set-Content -LiteralPath $probe -Value "Lyra updater signing check" -NoNewline
          try {
            npm run tauri -- signer sign --password "" $probe
            if ($LASTEXITCODE -ne 0) {
              throw "Tauri updater signing key validation failed."
            }
          } finally {
            Remove-Item -LiteralPath $probe, "$probe.sig" -Force -ErrorAction SilentlyContinue
          }

      - name: Verify release version
        run: npm run verify:version

      - name: Verify changelog
        run: npm run verify:changelog

      - name: Verify release configuration
        run: npm run verify:release-config

      - name: Build and test frontend
        run: |
          npm run build
          npm test -- --run

      - name: Format and test Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo test --release --locked --manifest-path src-tauri/Cargo.toml

      - name: Import Authenticode certificate when configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          if (-not $hasCertificate -and -not $hasPassword) {
            Write-Host "No Authenticode certificate configured; continuing with an unsigned Windows installer."
            exit 0
          }
          if (-not $hasCertificate -or -not $hasPassword) {
            throw "WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD must either both be configured or both be omitted."
          }
          New-Item -ItemType Directory -Force -Path certificate | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE -NoNewline
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -LiteralPath certificate/tempCert.txt
          $certificate = Import-PfxCertificate -FilePath certificate/certificate.pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText) | Select-Object -First 1
          if ($null -eq $certificate -or [string]::IsNullOrWhiteSpace($certificate.Thumbprint)) {
            throw "The Authenticode certificate could not be imported or has no thumbprint."
          }
          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $config.bundle.windows.certificateThumbprint = $certificate.Thumbprint
          $config.bundle.windows.digestAlgorithm = "sha256"
          $config.bundle.windows.timestampUrl = "http://timestamp.digicert.com"
          $config | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 src-tauri/tauri.conf.json
          Remove-Item -LiteralPath certificate/certificate.pfx -Force

      - name: Validate publication credentials
        shell: pwsh
        env:
          LYRA_RELEASES_APP_CLIENT_ID: ${{ vars.LYRA_RELEASES_APP_CLIENT_ID }}
          LYRA_RELEASES_APP_PRIVATE_KEY: ${{ secrets.LYRA_RELEASES_APP_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LYRA_RELEASES_APP_CLIENT_ID)) {
            throw "LYRA_RELEASES_APP_CLIENT_ID must be configured as a repository variable before publishing to OrionAISystems/Lyra-Releases."
          }
          if ([string]::IsNullOrWhiteSpace($env:LYRA_RELEASES_APP_PRIVATE_KEY)) {
            throw "LYRA_RELEASES_APP_PRIVATE_KEY must be configured as a repository secret before publishing to OrionAISystems/Lyra-Releases."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY must be configured before generating updater artifacts."
          }

      - name: Create short-lived release repository token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.LYRA_RELEASES_APP_CLIENT_ID }}
          private-key: ${{ secrets.LYRA_RELEASES_APP_PRIVATE_KEY }}
          owner: OrionAISystems
          repositories: Lyra-Releases
          permission-contents: write

      - name: Check out public release repository
        uses: actions/checkout@v4
        with:
          repository: OrionAISystems/Lyra-Releases
          ref: main
          token: ${{ steps.release-token.outputs.token }}
          path: release-repo

      - name: Sync public changelog
        id: changelog
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart("v")
          $notes = node scripts/changelog.mjs notes $version
          $notesExitCode = $LASTEXITCODE
          if ($notesExitCode -ne 0) {
            throw "Could not extract changelog notes for $env:RELEASE_TAG."
          }
          $notesText = ($notes -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($notesText)) {
            throw "Changelog notes for $env:RELEASE_TAG are empty."
          }

          Copy-Item -LiteralPath CHANGELOG.md -Destination release-repo/CHANGELOG.md -Force
          git -C release-repo config user.name "lyra-release-bot"
          git -C release-repo config user.email "lyra-release-bot@users.noreply.github.com"
          git -C release-repo add CHANGELOG.md
          $pending = git -C release-repo status --short
          if ([string]::IsNullOrWhiteSpace($pending)) {
            Write-Host "Public changelog is already current."
          } else {
            git -C release-repo commit -m "docs: sync changelog for v$version"
            git -C release-repo push origin HEAD:main
          }

          $output = [System.Text.StringBuilder]::new()
          [void]$output.AppendLine("release_body<<LYRA_RELEASE_BODY")
          [void]$output.AppendLine($notesText)
          [void]$output.AppendLine("Full changelog: https://github.com/OrionAISystems/Lyra-Releases/blob/main/CHANGELOG.md")
          [void]$output.AppendLine("LYRA_RELEASE_BODY")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, $output.ToString(), [System.Text.UTF8Encoding]::new($false))

      - name: Build and publish release artifacts
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: .
          tauriScript: npm run tauri
          tagName: ${{ github.ref_name }}
          releaseName: Lyra ${{ github.ref_name }}
          releaseBody: ${{ steps.changelog.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          owner: OrionAISystems
          repo: Lyra-Releases
          releaseCommitish: main
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
